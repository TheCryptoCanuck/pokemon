name: aviquest
description: AviQuest — Bird Identification & Collection Game
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  just_audio: ^0.9.36
  logging: ^1.2.0
  camera: ^0.10.5
  permission_handler: ^11.3.0
  cached_network_image: ^3.3.1
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/birds.json
    - assets/birds.json
