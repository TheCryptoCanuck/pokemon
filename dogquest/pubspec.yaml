name: dogquest
description: DogQuest — Dog Breed Identification & Collection Game
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  just_audio: ^0.9.36
  logging: ^1.2.0
  camera: ^0.10.5
  permission_handler: ^11.3.0
  cached_network_image: ^3.3.1
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  tflite_flutter: ^0.11.0
  image: ^4.0.17
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.0
  geolocator: ^13.0.2
  uuid: ^4.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  image_picker: ^1.0.7
  sentry_flutter: ^8.12.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_crashlytics: ^5.0.0
  qr_flutter: ^4.1.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  supabase_flutter: ^2.0.0
  intl: ^0.19.0
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/dogs.json
    - assets/dog_labels.txt
    - assets/dog_labels_imagenet.txt
    - assets/dog_model.tflite
    - assets/splash_logo.png

flutter_native_splash:
  color: "#1A0F0A"
  android: true
  ios: false
  android_12:
    color: "#1A0F0A"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#4A2F1A"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
