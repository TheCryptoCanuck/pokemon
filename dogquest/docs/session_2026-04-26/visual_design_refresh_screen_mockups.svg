<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="profileGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#539548" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4874E" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="cardTonal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2B1C"/>
      <stop offset="100%" stop-color="#15231A"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="900" fill="#0A1410"/>
  <text x="60" y="50" fill="#F5F2EC" font-size="22" font-weight="700">DogQuest — sample screens with refreshed tokens</text>
  <text x="60" y="74" fill="#B8B4AB" font-size="13">Left: Identify result bottom sheet (top-3 candidates, glass overlay).  Right: Kennel grid card + Profile hero header.</text>

  <!-- ======================== IDENTIFY RESULT (PHONE FRAME) ======================== -->
  <g transform="translate(60,110)">
    <!-- phone frame -->
    <rect width="360" height="740" rx="42" fill="#000" stroke="#2C4030" stroke-width="2"/>
    <rect x="14" y="14" width="332" height="712" rx="32" fill="#0F1A10"/>

    <!-- Camera viewport (dim) -->
    <rect x="14" y="14" width="332" height="450" rx="32" fill="#1A2B1C"/>
    <text x="180" y="240" fill="#7A766F" font-size="13" text-anchor="middle">[ camera frame — dimmed ]</text>

    <!-- Glass bottom sheet -->
    <g>
      <!-- glass overlay simulated -->
      <rect x="14" y="320" width="332" height="406" rx="28" fill="#1A2B1C" fill-opacity="0.85" stroke="#F5F2EC" stroke-opacity="0.12" stroke-width="1"/>
      <!-- drag handle -->
      <rect x="170" y="334" width="20" height="4" rx="2" fill="#7A766F"/>

      <!-- Header — neutral copy -->
      <text x="32" y="372" fill="#F5F2EC" font-size="20" font-weight="700">Best guesses</text>
      <text x="32" y="394" fill="#B8B4AB" font-size="12">Tap the one that matches your dog</text>

      <!-- Candidate tile 1 -->
      <g transform="translate(32,410)">
        <rect width="296" height="84" rx="16" fill="#15231A"/>
        <!-- rarity rim -->
        <rect width="4" height="84" rx="2" fill="#F2C49A"/>
        <!-- breed thumbnail placeholder -->
        <rect x="14" y="12" width="60" height="60" rx="12" fill="#223524"/>
        <text x="44" y="48" fill="#7A766F" font-size="10" text-anchor="middle">img</text>
        <!-- name + rarity chip -->
        <text x="86" y="36" fill="#F5F2EC" font-size="15" font-weight="600">Cavalier King Charles</text>
        <g transform="translate(86,46)">
          <rect width="68" height="18" rx="9" fill="#F2C49A" fill-opacity="0.18" stroke="#F2C49A" stroke-opacity="0.6"/>
          <text x="34" y="13" fill="#F2C49A" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.8">LEGENDARY</text>
        </g>
        <!-- confidence bar -->
        <rect x="86" y="70" width="180" height="4" rx="2" fill="#2C4030"/>
        <rect x="86" y="70" width="148" height="4" rx="2" fill="#D4874E"/>
        <text x="276" y="74" fill="#B8B4AB" font-size="10" text-anchor="end">0.83</text>
      </g>

      <!-- Candidate tile 2 -->
      <g transform="translate(32,506)">
        <rect width="296" height="64" rx="16" fill="#15231A"/>
        <rect width="4" height="64" rx="2" fill="#7AB8C9"/>
        <rect x="14" y="10" width="44" height="44" rx="10" fill="#223524"/>
        <text x="36" y="38" fill="#7A766F" font-size="10" text-anchor="middle">img</text>
        <text x="70" y="30" fill="#F5F2EC" font-size="14" font-weight="600">King Charles Spaniel</text>
        <g transform="translate(70,38)">
          <rect width="44" height="16" rx="8" fill="#7AB8C9" fill-opacity="0.18" stroke="#7AB8C9" stroke-opacity="0.6"/>
          <text x="22" y="11" fill="#7AB8C9" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8">RARE</text>
        </g>
        <rect x="70" y="56" width="180" height="3" rx="1.5" fill="#2C4030"/>
        <rect x="70" y="56" width="42" height="3" rx="1.5" fill="#D4874E"/>
        <text x="276" y="58" fill="#B8B4AB" font-size="10" text-anchor="end">0.09</text>
      </g>

      <!-- Candidate tile 3 -->
      <g transform="translate(32,582)">
        <rect width="296" height="64" rx="16" fill="#15231A"/>
        <rect width="4" height="64" rx="2" fill="#8DC681"/>
        <rect x="14" y="10" width="44" height="44" rx="10" fill="#223524"/>
        <text x="36" y="38" fill="#7A766F" font-size="10" text-anchor="middle">img</text>
        <text x="70" y="30" fill="#F5F2EC" font-size="14" font-weight="600">Cocker Spaniel</text>
        <g transform="translate(70,38)">
          <rect width="62" height="16" rx="8" fill="#8DC681" fill-opacity="0.18" stroke="#8DC681" stroke-opacity="0.6"/>
          <text x="31" y="11" fill="#8DC681" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8">UNCOMMON</text>
        </g>
        <rect x="70" y="56" width="180" height="3" rx="1.5" fill="#2C4030"/>
        <rect x="70" y="56" width="14" height="3" rx="1.5" fill="#D4874E"/>
        <text x="276" y="58" fill="#B8B4AB" font-size="10" text-anchor="end">0.03</text>
      </g>

      <!-- Manual search link -->
      <text x="180" y="678" fill="#B8B4AB" font-size="12" text-anchor="middle">Not in the list?  <tspan fill="#D4874E" font-weight="700">Search manually</tspan></text>

      <!-- Skip CTA -->
      <g transform="translate(32,694)">
        <rect width="296" height="20" rx="10" fill="none"/>
        <text x="148" y="14" fill="#7A766F" font-size="12" text-anchor="middle">Skip · don't add to kennel</text>
      </g>
    </g>

    <!-- caption -->
  </g>
  <g transform="translate(60,870)">
    <text x="0" y="0" fill="#D4874E" font-size="12" font-weight="700">IDENTIFY RESULT — bottom sheet, top-3 equal-weight tiles</text>
  </g>

  <!-- ======================== KENNEL CARD ======================== -->
  <g transform="translate(480,110)">
    <text x="0" y="0" fill="#F5F2EC" font-size="16" font-weight="700">Kennel grid card (180px)</text>
    <text x="0" y="20" fill="#B8B4AB" font-size="11">4px rarity rim, tonal gradient, no shadow</text>

    <!-- 4 cards in 2x2 -->
    <g transform="translate(0,40)">
      <!-- card 1 legendary -->
      <g>
        <rect width="180" height="220" rx="16" fill="url(#cardTonal)"/>
        <rect width="180" height="4" rx="2" fill="#F2C49A"/>
        <rect x="12" y="16" width="156" height="120" rx="12" fill="#223524"/>
        <text x="90" y="80" fill="#7A766F" font-size="10" text-anchor="middle">[ breed image ]</text>
        <text x="12" y="160" fill="#F5F2EC" font-size="13" font-weight="600">Cavalier KCS</text>
        <g transform="translate(12,170)">
          <rect width="68" height="18" rx="9" fill="#F2C49A" fill-opacity="0.18" stroke="#F2C49A" stroke-opacity="0.6"/>
          <text x="34" y="13" fill="#F2C49A" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8">LEGENDARY</text>
        </g>
        <text x="12" y="208" fill="#B8B4AB" font-size="10">Mastery ★★☆☆☆</text>
      </g>
      <!-- card 2 rare -->
      <g transform="translate(196,0)">
        <rect width="180" height="220" rx="16" fill="url(#cardTonal)"/>
        <rect width="180" height="4" rx="2" fill="#7AB8C9"/>
        <rect x="12" y="16" width="156" height="120" rx="12" fill="#223524"/>
        <text x="90" y="80" fill="#7A766F" font-size="10" text-anchor="middle">[ breed image ]</text>
        <text x="12" y="160" fill="#F5F2EC" font-size="13" font-weight="600">Bernese Mountain</text>
        <g transform="translate(12,170)">
          <rect width="44" height="18" rx="9" fill="#7AB8C9" fill-opacity="0.18" stroke="#7AB8C9" stroke-opacity="0.6"/>
          <text x="22" y="13" fill="#7AB8C9" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8">RARE</text>
        </g>
        <text x="12" y="208" fill="#B8B4AB" font-size="10">Mastery ★★★★☆</text>
      </g>
      <!-- card 3 uncommon -->
      <g transform="translate(0,236)">
        <rect width="180" height="220" rx="16" fill="url(#cardTonal)"/>
        <rect width="180" height="4" rx="2" fill="#8DC681"/>
        <rect x="12" y="16" width="156" height="120" rx="12" fill="#223524"/>
        <text x="90" y="80" fill="#7A766F" font-size="10" text-anchor="middle">[ breed image ]</text>
        <text x="12" y="160" fill="#F5F2EC" font-size="13" font-weight="600">Australian Shep.</text>
        <g transform="translate(12,170)">
          <rect width="62" height="18" rx="9" fill="#8DC681" fill-opacity="0.18" stroke="#8DC681" stroke-opacity="0.6"/>
          <text x="31" y="13" fill="#8DC681" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8">UNCOMMON</text>
        </g>
        <text x="12" y="208" fill="#B8B4AB" font-size="10">Mastery ★★★☆☆</text>
      </g>
      <!-- card 4 common -->
      <g transform="translate(196,236)">
        <rect width="180" height="220" rx="16" fill="url(#cardTonal)"/>
        <rect width="180" height="4" rx="2" fill="#B8B4AB"/>
        <rect x="12" y="16" width="156" height="120" rx="12" fill="#223524"/>
        <text x="90" y="80" fill="#7A766F" font-size="10" text-anchor="middle">[ breed image ]</text>
        <text x="12" y="160" fill="#F5F2EC" font-size="13" font-weight="600">Labrador Retriever</text>
        <g transform="translate(12,170)">
          <rect width="50" height="18" rx="9" fill="#B8B4AB" fill-opacity="0.16" stroke="#B8B4AB" stroke-opacity="0.5"/>
          <text x="25" y="13" fill="#B8B4AB" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8">COMMON</text>
        </g>
        <text x="12" y="208" fill="#B8B4AB" font-size="10">Mastery ★★★★★</text>
      </g>
    </g>
  </g>

  <!-- ======================== PROFILE HERO ======================== -->
  <g transform="translate(885,110)">
    <text x="0" y="0" fill="#F5F2EC" font-size="16" font-weight="700">Profile hero header</text>
    <text x="0" y="20" fill="#B8B4AB" font-size="11">Fraunces displayMedium + horizontal stat scroller</text>

    <g transform="translate(0,40)">
      <rect width="280" height="180" rx="20" fill="#0F1A10"/>
      <rect width="280" height="180" rx="20" fill="url(#profileGrad)"/>
      <!-- Avatar -->
      <circle cx="46" cy="92" r="32" fill="#D4874E"/>
      <text x="46" y="100" fill="#0F1A10" font-size="26" font-weight="700" text-anchor="middle">J</text>
      <!-- Username (Fraunces stand-in) -->
      <text x="92" y="80" fill="#F5F2EC" font-size="28" font-weight="700" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Jesse</text>
      <text x="92" y="104" fill="#B8B4AB" font-size="12">Pack Alpha · level 14</text>
      <!-- Streak chip -->
      <g transform="translate(92,120)">
        <rect width="86" height="22" rx="11" fill="#D4874E" fill-opacity="0.18" stroke="#D4874E" stroke-opacity="0.6"/>
        <text x="14" y="15" fill="#D4874E" font-size="11" font-weight="700">🔥 12-day streak</text>
      </g>
    </g>

    <!-- Stat cards horizontal -->
    <g transform="translate(0,236)">
      <text x="0" y="0" fill="#B8B4AB" font-size="11" font-weight="700" letter-spacing="1">PROGRESS</text>
      <g transform="translate(0,12)">
        <rect width="86" height="86" rx="16" fill="#1A2B1C"/>
        <text x="43" y="46" fill="#F5F2EC" font-size="32" font-weight="700" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">47</text>
        <text x="43" y="68" fill="#B8B4AB" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.8">BREEDS</text>
      </g>
      <g transform="translate(96,12)">
        <rect width="86" height="86" rx="16" fill="#1A2B1C"/>
        <text x="43" y="46" fill="#F5F2EC" font-size="32" font-weight="700" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">12</text>
        <text x="43" y="68" fill="#B8B4AB" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.8">STREAK</text>
      </g>
      <g transform="translate(192,12)">
        <rect width="86" height="86" rx="16" fill="#1A2B1C"/>
        <text x="43" y="46" fill="#F5F2EC" font-size="32" font-weight="700" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">14</text>
        <text x="43" y="68" fill="#B8B4AB" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.8">LEVEL</text>
      </g>
    </g>

    <!-- Achievement strip -->
    <g transform="translate(0,360)">
      <text x="0" y="0" fill="#B8B4AB" font-size="11" font-weight="700" letter-spacing="1">ACHIEVEMENTS</text>
      <g transform="translate(0,12)">
        <circle cx="22" cy="22" r="22" fill="#1A2B1C" stroke="#F2C49A" stroke-width="2"/>
        <text x="22" y="29" font-size="20" text-anchor="middle">🏆</text>
        <circle cx="68" cy="22" r="22" fill="#1A2B1C" stroke="#7AB8C9" stroke-width="2"/>
        <text x="68" y="29" font-size="20" text-anchor="middle">⭐</text>
        <circle cx="114" cy="22" r="22" fill="#1A2B1C" stroke="#8DC681" stroke-width="2"/>
        <text x="114" y="29" font-size="20" text-anchor="middle">🐺</text>
        <g transform="translate(146,0)">
          <rect width="56" height="44" rx="22" fill="#15231A" stroke="#2C4030"/>
          <text x="28" y="28" fill="#B8B4AB" font-size="12" font-weight="700" text-anchor="middle">+8</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer key -->
  <g transform="translate(60,840)">
    <text x="0" y="0" fill="#7A766F" font-size="11">All colours from §3.1 token table.  Wordmark/numerals shown in Georgia italic as a stand-in for Fraunces 700 italic.</text>
  </g>
</svg>
