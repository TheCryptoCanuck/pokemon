name: CI

on:
  push:
    branches: [main, phase-1/social-backend-realtime]
  pull_request:
    branches: [main, phase-1/social-backend-realtime]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./dogquest

jobs:
  format:
    name: dart format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output none --set-exit-if-changed .

  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --fatal-infos

  test:
    name: flutter test
    runs-on: ubuntu-latest
    # Pre-existing failures: 13 tests in test/sync_services_test.dart (Ref-cast hack
    # broken by Dart null-safety) + 1 file failing to load
    # (test/supabase_social_test.dart, Supabase mock API drift). Both tracked as
    # T5 in .second_brain/03_Projects/Active_Tasks.md. Until those close, this
    # job runs for visibility but does not block PRs. Flip continue-on-error to
    # false once the two T5 tasks land.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test --reporter expanded

  build-debug-apk:
    name: build debug APK
    runs-on: ubuntu-latest
    needs: [format, analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: dogquest-debug-apk
          path: dogquest/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
