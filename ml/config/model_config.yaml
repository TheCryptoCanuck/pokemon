# AviQuest Bird Classification Model Configuration

model:
  # Architecture: EfficientNet-B4 provides good accuracy/speed tradeoff for bird classification
  backbone: "efficientnet_b4"
  num_classes: 525  # NABirds + extended species
  pretrained: true
  dropout_rate: 0.3
  label_smoothing: 0.1

  # Input specifications
  input:
    image_size: 380
    channels: 3
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]

  # Head configuration
  head:
    type: "linear"  # "linear" or "mlp"
    hidden_dim: 512
    activation: "gelu"

training:
  batch_size: 32
  num_epochs: 50
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 5
  min_lr: 1.0e-6

  # Optimizer
  optimizer: "adamw"
  scheduler: "cosine"

  # Mixed precision
  mixed_precision: true

  # Early stopping
  early_stopping:
    patience: 10
    min_delta: 0.001
    monitor: "val_accuracy"

  # Data augmentation
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation_range: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1
    random_erasing: 0.25
    mixup_alpha: 0.2
    cutmix_alpha: 1.0

  # Distributed training
  distributed:
    enabled: false
    backend: "nccl"
    world_size: 1

evaluation:
  top_k: [1, 3, 5]
  confidence_threshold: 0.15
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "auc_roc"

export:
  onnx:
    opset_version: 17
    dynamic_axes: true
  quantization:
    method: "dynamic"  # "dynamic", "static", "qat"
    dtype: "int8"
  tflite:
    enabled: true
    optimize_for_mobile: true
