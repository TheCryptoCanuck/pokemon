services:
  serving:
    build:
      context: .
      target: serving
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    environment:
      - DEVICE=cpu
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"

  training:
    build:
      context: .
      target: training
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - ./model_registry:/app/model_registry
      - ./config:/app/config:ro
    environment:
      - DEVICE=auto
    profiles:
      - training
    command: ["--train-dir", "data/train", "--val-dir", "data/val"]
