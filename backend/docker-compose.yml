version: '3.8'

services:
  # FastAPI backend service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aviquest-api
    ports:
      - "8000:8000"
    environment:
      # Application settings
      PROJECT_NAME: "AviQuest API"
      VERSION: "1.0.0"
      DEBUG: "false"

      # JWT authentication — REQUIRED: change in production
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}

      # Database configuration
      # SQLite (default for dev/small deployments): sqlite+aiosqlite:///./aviquest.db
      # PostgreSQL (recommended for production): postgresql+asyncpg://user:pass@host:5432/aviquest
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./aviquest.db}

      # CORS allowed origins — restrict in production
      # Format: ["http://localhost:3000", "https://app.example.com"]
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}

      # Game mechanics (optional overrides)
      XP_LEVEL_BASE: ${XP_LEVEL_BASE:-1000}
      XP_LEVEL_EXPONENT: ${XP_LEVEL_EXPONENT:-1.4}

    # Volume for SQLite database persistence
    volumes:
      - ./aviquest.db:/app/aviquest.db
      - ./alembic:/app/alembic

    # Restart policy for production deployment
    restart: unless-stopped

    # Network configuration
    networks:
      - aviquest-network

    # Resource limits (optional, adjust based on VPS sizing)
    # Uncomment for production deployments
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

networks:
  aviquest-network:
    driver: bridge

# Notes for deployment:
#
# LOCAL DEVELOPMENT:
#   docker-compose up
#   App will be available at http://localhost:8000
#   API docs at http://localhost:8000/api/v1/docs
#
# RAILWAY/RENDER DEPLOYMENT:
#   1. Create .env file with production secrets:
#      SECRET_KEY=<generated-32-char-hex>
#      DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/aviquest
#      ALLOWED_ORIGINS=["https://your-app.example.com"]
#   2. Point to this docker-compose.yml in platform settings
#   3. Set PORT=8000 if platform overrides it
#
# VPS DEPLOYMENT (e.g., DigitalOcean, Linode):
#   1. SSH to server
#   2. Install Docker & Docker Compose
#   3. Clone repo and cd backend/
#   4. Create .env with production values
#   5. docker-compose up -d
#   6. nginx reverse proxy to localhost:8000
#
# DATABASE MIGRATION:
#   For SQLite → PostgreSQL migration:
#   1. Set DATABASE_URL to PostgreSQL connection string
#   2. Run: docker-compose exec api alembic upgrade head
#   3. Backfill data or start fresh
#
# HEALTH CHECK:
#   curl http://localhost:8000/health
#   Expected: {"status": "ok", "version": "1.0.0"}
